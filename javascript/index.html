<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JavaScript App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 2rem;
      background-color: #f4f4f9;
    }
    .card {
      background: white;
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 400px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    input, button {
      padding: 0.5rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Interactive Greeting</h2>
    <label for="userName">Enter your name:</label><br>
    <input type="text" id="userName" placeholder="e.g., Alex">
    <button id="greetBtn">Greet Me</button>

    <!-- This is where our JavaScript will display the output -->
    <p id="greetingMessage"></p>
  </div>

  <script>
    // 1. Select DOM elements
    const nameInput = document.getElementById("userName");
    const greetBtn = document.getElementById("greetBtn");
    const messageOutput = document.getElementById("greetingMessage");

    // 2. Define the greeting logic in a function
    function generateGreeting(name) {
      if (!name.trim()) {
        return "Please enter a valid name!";
      }
      return `Hello, ${name}! Welcome to JavaScript programming.`;
    }

    // 3. Attach an Event Listener to the button
    greetBtn.addEventListener("click", () => {
      // Get input value
      const enteredName = nameInput.value;

      // Generate message using our function
      const result = generateGreeting(enteredName);

      // Render the result in the DOM
      messageOutput.textContent = result;
      messageOutput.style.color = enteredName.trim() ? "green" : "red";
    });
  </script>

</body>
</html>
